<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DTF Club Rulebook</title>

:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaf0;--mute:#9aa1b0;--line:#262b36;--accent:#ff8a3d;--accent2:#4d9fff;--hi:#3a2f0f;--hi-ink:#ffd27a;
--pass:#35c26b;--fail:#e5484d;--pend:#eab308;
--c-SC:#ff8a3d;--c-RO:#4d9fff;--c-IR:#e5484d;--c-TR:#14b8a6;--c-PL:#a855f7;--c-SA:#eab308;--c-DR:#35c26b;--c-MN:#d6399e;--c-GV:#9aa1b0;--c-FUN:#22d3ee}
@media(prefers-color-scheme:light){:root{--bg:#f5f6f9;--card:#fff;--ink:#1a1d24;--mute:#666e7e;--line:#e2e5ec;--accent:#e26a1f;--accent2:#2f6fd6;--hi:#fff4d6;--hi-ink:#7a5200;
--pass:#1f9d52;--fail:#d43b40;--pend:#a16207;
--c-SC:#e26a1f;--c-RO:#2f6fd6;--c-IR:#d43b40;--c-TR:#0d9488;--c-PL:#9333ea;--c-SA:#a16207;--c-DR:#1f9d52;--c-MN:#c23b8a;--c-GV:#666e7e;--c-FUN:#0891b2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 8px;max-width:1000px;margin:auto}
@media(max-width:720px){header{padding-top:calc(env(safe-area-inset-top,0px) + 56px)}}
h1{margin:0;font-size:24px}.sub{color:var(--mute);font-size:13px}
main{max-width:1000px;margin:auto;padding:0 16px 48px}
nav{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
nav button,.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:999px;cursor:pointer;font:inherit}
nav button.on,.chip.on{background:var(--accent);border-color:var(--accent);color:#0f1115;font-weight:600}
h1{border-left:5px solid var(--accent);padding-left:10px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.filters label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
select,input[type=search]{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;width:100%}
.count{color:var(--mute);font-size:13px;margin:6px 0 10px}
.yr{margin:22px 0 6px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:4px}
.rule{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:10px;padding:11px 13px;margin-bottom:8px}
.sect{display:flex;align-items:center;gap:8px;margin:24px 0 6px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.sect:before{content:'';width:10px;height:10px;border-radius:3px;background:var(--c)}
.sect:after{content:'';flex:1;height:1px;background:color-mix(in srgb,var(--c) 40%,transparent)}
.ylab{font-size:12px;color:var(--mute);margin:2px 0 4px}
.yrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px;margin-bottom:12px}
.yrc{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 0;border-radius:8px;cursor:pointer;font:inherit;font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.yrc:hover{border-color:var(--accent)}
.yrc.on{background:var(--accent);border-color:var(--accent);color:#0f1115;font-weight:600}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:start}
.layout .body{min-width:0}
.chips{display:flex;flex-direction:column;gap:6px;position:sticky;top:12px}
.chips .chipc{text-align:left;width:100%;border-radius:10px;padding:8px 12px}
.chipc .short{display:none}
@media(max-width:720px){.yrs{grid-template-columns:repeat(auto-fit,minmax(36px,1fr));gap:4px}.yrc{font-size:11.5px;padding:5px 0;border-radius:7px}}
@media(max-width:720px){.layout{grid-template-columns:1fr;gap:10px}.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;position:static;margin-bottom:4px}.chips .chipc{width:100%;min-width:0;padding:7px 2px;font-size:12px;line-height:1.1;text-align:center;border-radius:8px;white-space:nowrap}.chipc .full{display:none}.chipc .short{display:inline}}
.chipc{border:1px solid color-mix(in srgb,var(--c,var(--accent)) 65%,transparent);color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 8%,transparent);padding:5px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
.chipc:hover{background:color-mix(in srgb,var(--c,var(--accent)) 20%,transparent)}
.chipc.on{background:var(--c,var(--accent));color:#0f1115;font-weight:600}
.chipc.all{--c:var(--ink)}.chipc.all.on{color:var(--bg)}
a.tag{text-decoration:none;color:var(--accent2);border-color:var(--accent2)}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rhead h3{margin:0}
.corner{flex:none;text-align:right;line-height:1.15}
.corner b{display:block;font-size:13px;color:var(--c);font-variant-numeric:tabular-nums}
.corner span{display:block;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.fn{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);font-size:12px;color:var(--mute)}
.fn b{font-weight:600}
.hist .hh{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.hist b{color:var(--c);font-variant-numeric:tabular-nums;margin-right:4px}
.val{color:var(--c);font-weight:700}
.subh{margin:12px 0 5px 2px;font-size:12px;color:var(--mute);font-weight:600}
.rule h3{margin:0 0 5px;font-size:15px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.tag{padding:1px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px;font-weight:600}
.s-PASS{color:var(--pass);border-color:var(--pass)}.s-FAIL{color:var(--fail);border-color:var(--fail)}
.s-PENDING,.s-TABLED,.s-EXPLORE,.s-WITHDRAWN{color:var(--pend);border-color:var(--pend)}
.cat{color:var(--c);border-color:color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.note{margin-top:5px;font-size:13px;color:var(--mute)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hi{background:var(--hi)}tr.hi td:first-child{color:var(--hi-ink);font-weight:600}
.badge{background:var(--hi);color:var(--hi-ink);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;margin-left:6px}
h2{font-size:17px;margin:20px 0 8px}
.callout{background:var(--hi);color:var(--hi-ink);border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:14px}
.callout ul{margin:6px 0 0;padding-left:18px}
.status{font-size:12px;color:var(--mute);margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.kv{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}.kv b{display:block;font-size:12px;color:var(--mute);font-weight:600}
</style>
</head>

function chipBar(host, cats, onChange){
  const sel=new Set();
  host.className="chips";
  host.innerHTML=`<button class="chipc all on" data-k=""><span class="full">All types</span><span class="short">All</span></button>`+cats.map(k=>`<button class="chipc" data-k="${k}" style="--c:var(--c-${k})"><span class="full">${esc(CATS[k])}</span><span class="short">${esc(SHORT[k])}</span></button>`).join("");
  host.onclick=e=>{
    const b=e.target.closest("button");if(!b)return;
    const k=b.dataset.k;
    if(!k)sel.clear();else sel.has(k)?sel.delete(k):sel.add(k);
    host.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.k?sel.has(x.dataset.k):!sel.size));
    onChange();
  };
  return ()=>sel;
}
function yearBar(host, years, onChange, withNone){

      if(r.year!==last){out+=`<div class="yr">${r.year}${r.year===2026?" suggestions (open)":""}</div>`;last=r.year}
      out+=`<div class="rule" style="--c:var(--c-${r.category})"><h3>${esc(r.title)}</h3><div class="meta">
        <span class="tag s-${r.status}">${esc(STATUS[r.status])}${r.vote?" · "+esc(r.vote):""}</span>${r.flag==="sup"?'<span class="tag s-FAIL">Superseded</span>':r.flag==="unv"?'<span class="tag s-PENDING">Not in Sleeper scoring</span>':r.status==="PASS"&&r.flag==="once"?'<span class="tag">One-time</span>':r.status==="PASS"?'<span class="tag s-PASS">In force</span>':""}
        <span class="tag cat" style="--c:var(--c-${r.category})">${esc(CATS[r.category])}</span>
        ${r.nominator?`<span>by ${esc(r.nominator)}</span>`:""}${r.impact?`<span>impact: ${esc(r.impact)}</span>`:""}${link(r)}</div>
        ${r.notes?`<div class="note">${esc(r.notes)}</div>`:""}</div>`;
    });
    $("#list").innerHTML=out||'<div class="note">No entries match.</div>';
  };
  $("#fs").addEventListener("change",apply);
  $("#fq").addEventListener("input",apply);
  apply();
}

/* ---- open suggestions (pending / tabled / exploring) ---- */
function renderOpen(rules){
  const OPEN=["PENDING","TABLED","EXPLORE"];
  const all=rules.filter(r=>r.year===2026&&OPEN.includes(r.status));
  const cats=Object.keys(CATS).filter(k=>all.some(r=>r.category===k));
  $("#open").innerHTML=`<div class="status">Suggestions awaiting a vote. These come from the 2026 tab of the League Suggestions sheet; new posts from #league-suggestions are added when Ben reacts to them with 📖.</div>
  <div class="layout"><aside id="ochips"></aside><div class="body">
  <div class="filters"><label>Search<input type="search" id="oq"></label></div>
  <div class="count" id="ocnt"></div><div id="olist"></div></div></div>`;
  const sel=chipBar($("#ochips"),cats,()=>apply());
  const apply=()=>{
    const q=$("#oq").value.toLowerCase(),c=sel();
    const m=all.filter(r=>(!c.size||c.has(r.category))&&(!q||(r.title+" "+r.notes+" "+r.nominator).toLowerCase().includes(q)));
    m.sort((a,b)=>a.ord-b.ord||a.id-b.id);
    $("#ocnt").textContent=`${m.length} open suggestion${m.length===1?"":"s"}`;
    let out="";
    m.forEach(r=>{
      out+=`<div class="rule" style="--c:var(--c-${r.category})"><h3>${esc(r.title)}</h3><div class="meta">
        <span class="tag s-${r.status}">${esc(STATUS[r.status])}${r.vote?" · "+esc(r.vote):""}</span>
        <span class="tag cat" style="--c:var(--c-${r.category})">${esc(CATS[r.category])}</span>
        ${r.nominator?`<span>by ${esc(r.nominator)}</span>`:""}${r.impact?`<span>impact: ${esc(r.impact)}</span>`:""}${link(r)}</div>
        ${r.notes?`<div class="note">${esc(r.notes)}</div>`:""}</div>`;
    });
    $("#olist").innerHTML=out||'<div class="note">Nothing open.</div>';
  };
  $("#oq").addEventListener("input",apply);apply();
}

/* ---- scoring rules rendered from Sleeper's live scoring settings ---- */
const num=v=>Math.round(v*10000)/10000;
const P=v=>`${num(v)} Point${Math.abs(num(v))===1?"":"s"}`;
const f2=v=>(Math.round(v*100)/100).toString();
const SCORE={
 ppr:s=>({label:"Reception (PPR)",value:`${P(s.rec||s.rec_0_4)} per catch`,detail:["Every catch counts the same, 0+ yards."]}),
 fd:s=>({label:"First Downs",value:`${P(s.bonus_fd_rb)} (RB / WR / TE) · ${P(s.bonus_fd_qb)} (QB)`}),
 sack:s=>({label:"QB Sacked",value:P(s.pass_sack)}),
 fum:s=>({label:"Fumbles",value:`${P(s.fum)} · Fumble Lost ${P(s.fum_lost)}`}),
 pick6:s=>({label:"Pick-Six Thrown",value:`${P(s.pass_int_td)} extra`,detail:[`${P(s.pass_int+s.pass_int_td)} total with the interception`]}),
 xpmiss:s=>({label:"Missed Extra Point",value:P(s.xpmiss)}),
 fg:s=>({label:"Field Goals",value:`${P(s.fgm)} + ${P(s.fgm_yds_over_30)} per yard over 30`,detail:[`50-yard FG = ${P(s.fgm+20*s.fgm_yds_over_30)} · Missed FG ${P(s.fgmiss)}`]}),
 tfl:s=>({label:"Tackle for Loss",value:P(s.tkl_loss)}),
 tao:s=>({label:"Defensive 3-and-Out",value:P(s.def_3_and_out)}),
 d2pt:s=>({label:"Defense Returns a 2-Point Conversion",value:P(s.def_2pt)}),
 fds:s=>({label:"4th Down Stop",value:P(s.def_4_and_stop)}),
 scaled:s=>{const pb=s.pts_allow_0,yb=s.yds_allow_0_100;return {label:"Scaled Defensive Scoring",value:`${P(s.pts_allow)} per point allowed · ${P(s.yds_allow)} per yard allowed`,
   detail:[`Points allowed (starts at ${f2(pb)}): `+[0,10,20,30,40].map(x=>`${x} → ${f2(pb+s.pts_allow*x)}`).join(" · "),
           `Yards allowed (starts at ${f2(yb)}): `+[0,100,200,300,400].map(x=>`${x} → ${f2(yb+s.yds_allow*x)}`).join(" · ")]}},
 ffum:s=>({label:"D/ST Forced Fumble & Recovery",value:`Forced fumble ${P(s.def_st_ff)} · Fumble recovery ${P(s.def_st_fum_rec)}`,detail:[`Players: forced fumble ${P(s.ff)} · fumble recovery ${P(s.fum_rec)}`]}),
 kr:s=>({label:"Kick & Punt Return Yards",value:`${P(s.kr_yd)} per yard (1 Point per ${Math.round(1/s.kr_yd)} yards)`}),
 dret:s=>({label:"Defensive Return Yards",value:`${P(s.int_ret_yd)} per yard (1 Point per ${Math.round(1/s.int_ret_yd)} yards) on interception / fumble returns`,
   detail:[`Blocked / missed FG returns: ${P(s.fg_ret_yd)} per yard (1 Point per ${Math.round(1/s.fg_ret_yd)} yards)`]})
};
function scoreView(r,sc){
  if(!r.bind||!sc||!SCORE[r.bind])return null;
  try{const v=SCORE[r.bind](sc);return /NaN|undefined|Infinity/.test(JSON.stringify(v))?null:v}catch(e){return null}
}

const SRC={"league site":"Site","suggestions sheet":"Sheet","per commissioner":"Comm."};
const notesHtml=n=>{
  if(!n)return "";
  const parts=n.split(" // ");
  if(parts.length<2)return `<div class="note">${esc(n)}</div>`;
  return `<div class="note hist"><div class="hh">${esc(parts[0])}</div>`+parts.slice(1).map(x=>{const m=x.match(/^(\d{4}) · (.*)$/);return m?`<div><b>${m[1]}</b> ${esc(m[2])}</div>`:`<div>${esc(x)}</div>`}).join("")+`</div>`;
};
/* ---- current rules ---- */
function renderCurrent(cur,sc){
  const years=[...new Set(cur.map(r=>r.year).filter(Boolean))].sort((a,b)=>b-a);
  const cats=Object.keys(CATS).filter(k=>cur.some(r=>r.category===k));
  $("#current").innerHTML=`<div class="status">Every rule in force. Top right of each card: year it passed and source (Site / Sheet / Comm.). Replaced rules are footnoted; the full record is in Rule history.</div>
  <div class="layout"><aside id="cchips"></aside><div class="body">
  <div class="filters">
   <label>Search<input type="search" id="cq"></label>
  </div>
  <div class="ylab">Year</div><div id="cyears"></div>
  <div class="count" id="ccnt"></div><div id="clist"></div></div></div>`;
  const sel=chipBar($("#cchips"),cats,()=>apply());
  const ysel=yearBar($("#cyears"),years.slice().reverse(),()=>apply(),true);
  const apply=()=>{
    const q=$("#cq").value.toLowerCase(),c=sel(),ys=ysel();
    const m=cur.filter(r=>(!c.size||c.has(r.category))&&(!ys.size||ys.has(r.year?String(r.year):"none"))&&(!q||(r.rule+" "+r.group+" "+r.notes).toLowerCase().includes(q)));
    m.sort((a,b)=>a.ord-b.ord||(b.year||0)-(a.year||0)||a.id-b.id);
    $("#ccnt").textContent=`${m.length} of ${cur.length} rules in force`;
    let out="",last=null,lastSub=null;
    m.forEach(r=>{
      if(r.category!==last){out+=`<div class="sect" style="--c:var(--c-${r.category})">${esc(CATS[r.category])}</div>`;last=r.category;lastSub=null}
      if(r.sub!==lastSub){out+=`<div class="subh">${esc(r.sub)}</div>`;lastSub=r.sub}
      const sv=scoreView(r,sc);
      out+=`<div class="rule" style="--c:var(--c-${r.category})"><div class="rhead"><h3>${sv?`${esc(sv.label)}: <span class="val">${esc(sv.value)}</span>`:esc(r.rule)}</h3><div class="corner"><b>${r.year||"—"}</b><span title="${esc(r.label)}">${esc(SRC[r.label]||r.label)}</span></div></div>${sv?(sv.detail||[]).map(d=>`<div class="note">${esc(d)}</div>`).join(""):notesHtml(r.notes)}${(r.replaces||[]).length||(r.amended||[]).length?`<div class="fn">${(r.amended||[]).map(x=>`<div>↳ <b>Amended</b> (${x.year}): ${esc(x.text)}</div>`).join("")}${(r.replaces||[]).map(x=>`<div>↳ <b>Replaces</b> (${x.year}): ${esc(x.title)}${x.notes?` — <i>${esc(x.notes)}</i>`:""}</div>`).join("")}</div>`:""}</div>`;
    });
    $("#clist").innerHTML=out||'<div class="note">No rules match.</div>';
  };
  $("#cq").addEventListener("input",apply);apply();
}

/* ---- scoring (live from Sleeper) ---- */
/* Baseline = Sleeper's stock PPR-style template; anything different is flagged as distinctive. */
const BASE={pass_yd:.04,pass_td:4,pass_int:-1,pass_2pt:2,rush_yd:.1,rush_td:6,rush_2pt:2,rec:1,rec_yd:.1,rec_td:6,rec_2pt:2,fum_lost:-1,fum_rec_td:6,
 xpm:1,fgm_0_19:3,fgm_20_29:3,fgm_30_39:3,fgm_40_49:4,fgm_50p:5,fgmiss:0,sack:1,int:2,fum_rec:2,safe:2,blk_kick:2,def_td:6,def_st_td:6,st_td:6,st_ff:1,st_fum_rec:1,def_st_ff:1,def_st_fum_rec:1,ff:0,
 pts_allow_0:10,pts_allow_1_6:7,pts_allow_7_13:4,pts_allow_14_20:1,pts_allow_21_27:0,pts_allow_28_34:-1,pts_allow_35p:-4};
const LABEL={pass_yd:"Passing yard",pass_td:"Passing TD",pass_int:"Interception thrown",pass_int_td:"Pick-six thrown (extra)",pass_sack:"QB sacked",pass_2pt:"Passing 2pt",pass_fd:"Passing first down",bonus_fd_qb:"QB first down",
 rush_yd:"Rushing yard",rush_td:"Rushing TD",rush_2pt:"Rushing 2pt",rush_fd:"Rushing first down",bonus_fd_rb:"RB first down",bonus_fd_wr:"WR first down",bonus_fd_te:"TE first down",
 rec:"Reception",rec_0_4:"Reception (0–4 yd)",rec_5_9:"Reception (5–9 yd)",rec_10_19:"Reception (10–19 yd)",rec_20_29:"Reception (20–29 yd)",rec_30_39:"Reception (30–39 yd)",rec_40p:"Reception (40+ yd)",
 rec_yd:"Receiving yard",rec_td:"Receiving TD",rec_2pt:"Receiving 2pt",rec_fd:"Receiving first down",fum:"Fumble",fum_lost:"Fumble lost",fum_rec:"Fumble recovered",fum_rec_td:"Fumble recovery TD",fum_ret_yd:"Fumble return yard",
 kr_yd:"Kick return yard",pr_yd:"Punt return yard",st_td:"Special teams TD",st_ff:"ST forced fumble",st_fum_rec:"ST fumble recovery",
 ff:"Forced fumble (player)",tkl_loss:"Tackle for loss",
 xpm:"Extra point made",xpmiss:"Extra point missed",fgm:"FG made (base)",fgm_yds_over_30:"FG bonus per yard over 30",fgmiss:"FG missed",
 sack:"Sack",int:"Interception",int_ret_yd:"INT return yard",safe:"Safety",blk_kick:"Blocked kick",blk_kick_ret_yd:"Blocked kick return yard",fg_ret_yd:"Missed-FG return yard",
 def_td:"Defensive TD",def_st_td:"D/ST special teams TD",def_st_ff:"D/ST forced fumble",def_st_fum_rec:"D/ST fumble recovery",def_2pt:"Defense returns 2pt",def_3_and_out:"3-and-out forced",def_4_and_stop:"4th down stop",
 pts_allow:"Per point allowed",yds_allow:"Per yard allowed"};
const GROUPS=[["Passing",/^(pass_|bonus_fd_qb)/],["Rushing",/^rush_|bonus_fd_rb/],["Receiving",/^(rec|bonus_fd_(wr|te))/],["Fumbles",/^fum(?!_ret)/],
 ["Returns",/^(kr_|pr_|fum_ret_yd|int_ret_yd|blk_kick_ret|fg_ret_yd|st_td)/],["Kicking",/^(xp|fg)/],["Defense / ST",/^(sack|int$|safe|blk_kick$|def_|st_|ff$|tkl_loss|pts_allow$|yds_allow$)/]];
function labelFor(k){
  if(LABEL[k])return LABEL[k];
  let m;
  if(m=k.match(/^pts_allow_(\d+)(?:_(\d+))?(p)?$/))return "Points allowed: "+(m[3]?m[1]+"+":m[2]?m[1]+"–"+m[2]:m[1]);
  if(m=k.match(/^yds_allow_(\d+)(?:_(\d+))?(p)?$/))return "Yards allowed: "+(m[3]?m[1]+"+":m[2]?m[1]+"–"+m[2]:m[1]);
  if(m=k.match(/^fgm_(\d+)_?(\d+|p)$/))return "FG "+m[1]+(m[2]==="p"?"+":"–"+m[2])+" yd";
  return k;
}
const fmt=v=>(v>0?"+":"")+(Math.round(v*10000)/10000);
function distinct(sc){
  const notes=[];const s=sc;
  if(s.yds_allow!==undefined&&s.yds_allow_0_100!==undefined)notes.push(`<b>Scaled defense:</b> instead of cutoffs, D/ST gets a flat ${s.pts_allow_0} for points allowed ${fmt(s.pts_allow)} per point, and ${s.yds_allow_0_100} for yards allowed ${fmt(s.yds_allow)} per yard.`);
  if(s.fgm!==undefined)notes.push(`<b>Decimal kickers:</b> FG = ${s.fgm} + ${+s.fgm_yds_over_30.toFixed(2)} per yard over 30 (a 50-yarder = ${(s.fgm+20*s.fgm_yds_over_30).toFixed(1)}), miss ${fmt(s.fgmiss)}, missed XP ${fmt(s.xpmiss)}.`);
  if(s.bonus_fd_wr||s.bonus_fd_rb)notes.push(`<b>First downs:</b> ${s.bonus_fd_rb} for RB/WR/TE and ${s.bonus_fd_qb} for QB first downs.`);
  if(s.kr_yd||s.pr_yd)notes.push(`<b>Return yards count</b> for players (${(1/s.kr_yd).toFixed(0)} yd/pt KR &amp; PR) and for D/ST (${(1/s.int_ret_yd).toFixed(0)} yd/pt INT/fumble returns, ${(1/s.fg_ret_yd).toFixed(0)} yd/pt on blocked/missed FG returns).`);
  if(s.def_3_and_out||s.def_4_and_stop)notes.push(`<b>Defensive stops:</b> ${s.def_3_and_out} per 3-and-out, ${s.def_4_and_stop} per 4th-down stop; ${s.tkl_loss} per tackle for loss.`);
  if(s.def_2pt)notes.push(`<b>Defense returns a 2pt conversion:</b> ${s.def_2pt} pts.`);
  if(s.fum_rec>=1)notes.push(`<b>Fumble recovery</b> is worth ${s.fum_rec}; fumble ${fmt(s.fum)}, lost ${fmt(s.fum_lost)}; QB sack ${fmt(s.pass_sack)}; pick-six thrown ${fmt(s.pass_int+s.pass_int_td)} total.`);
  if(s.rec===0&&s.rec_0_4===1)notes.push(`<b>Full PPR on every catch</b> via yardage buckets (0+ yds = 1 pt), not the flat PPR setting.`);
  return notes;
}
function renderScoring(L,live){
  const sc=L.scoring_settings;const used=new Set();
  const nd=distinct(sc);
  let h=`<div class="status">${live?"Live from Sleeper":"Offline snapshot (Sleeper unreachable)"} · ${esc(L.name)} ${esc(L.season)}. Highlighted rows differ from Sleeper's stock PPR template.</div>`;
  if(nd.length)h+=`<div class="callout"><b>What's distinctive about our scoring</b><ul>${nd.map(n=>`<li>${n}</li>`).join("")}</ul></div>`;
  const buckets=k=>/^(pts_allow_|yds_allow_|fgm_\d|rec_\d)/.test(k);
  GROUPS.forEach(([name,re])=>{
    const keys=Object.keys(sc).filter(k=>!used.has(k)&&re.test(k)&&sc[k]!==0).sort();
    if(!keys.length)return;
    keys.forEach(k=>used.add(k));
    h+=`<h2>${name}</h2><table><tr><th>Stat</th><th class="num">Points</th></tr>`+keys.map(k=>{
      const diff = k in BASE ? BASE[k]!==sc[k] : !buckets(k)||true;
      return `<tr class="${diff?"hi":""}"><td>${esc(labelFor(k))}</td><td class="num">${fmt(sc[k])}</td></tr>`}).join("")+`</table>`;
  });
  $("#scoring").innerHTML=h;
}

/* ---- league setup ---- */
function renderSetup(L){
  const s=L.settings,pos={};L.roster_positions.forEach(p=>pos[p]=(pos[p]||0)+1);
  const NAME={QB:"QB",RB:"RB",WR:"WR",TE:"TE",FLEX:"FLEX (RB/WR/TE)",REC_FLEX:"WR/TE flex",SUPER_FLEX:"SUPERFLEX (incl. QB)",K:"Kicker",DEF:"D/ST",BN:"Bench"};
  const kv=(a,b)=>`<div class="kv"><b>${esc(a)}</b>${esc(b)}</div>`;
  const wt={0:"Rolling",1:"Reverse standings",2:"FAAB"}[s.waiver_type]||s.waiver_type;
  $("#setup").innerHTML=`<h2>Lineup (${L.total_rosters} teams)</h2><div class="grid">`+
   Object.entries(pos).map(([p,n])=>kv(NAME[p]||p,n+" slot"+(n>1?"s":""))).join("")+kv("IR slots",s.reserve_slots)+`</div>
   <h2>Roster limits</h2><div class="grid">${["qb","rb","wr","te","k","def"].map(p=>kv(p.toUpperCase()+" max",s["position_limit_"+p])).join("")}</div>
   <h2>Transactions</h2><div class="grid">${kv("Waiver type",wt)}${kv("FAAB budget","$"+s.waiver_budget)}${kv("Trade deadline","Week "+s.trade_deadline)}
    ${kv("Trade review days",s.trade_review_days)}${kv("Daily waivers",s.daily_waivers?"On":"Off")}${kv("Waivers clear (hour, league tz)",s.daily_waivers_hour+":00")}
    ${kv("IR allows",["out"&&s.reserve_allow_out?"Out":null,s.reserve_allow_doubtful?"Doubtful":null,s.reserve_allow_sus?"Suspended":null,s.reserve_allow_cov?"COVID":null,s.reserve_allow_dnr?"DNR":null].filter(Boolean).join(", ")||"–")}
    ${kv("Bench lock",s.bench_lock?"On":"Off")}</div>
   <h2>Playoffs</h2><div class="grid">${kv("Playoff teams",s.playoff_teams)}${kv("Playoffs start","Week "+s.playoff_week_start)}${kv("Regular season weeks",s.playoff_week_start-1)}</div>
   <div class="note" style="margin-top:12px">Sacko bracket, Rumbles standings and the auction aren't Sleeper settings. See the Rulebook tab, Sacko and Playoffs categories.</div>`;
}

/* ---- boot ---- */
Promise.all([
  Promise.resolve(INLINE.current),
  Promise.resolve(INLINE.rules),
  getJSON(`${CONFIG.api}/league/${CONFIG.leagueId}`).then(d=>[d,true]).catch(()=>Promise.resolve([INLINE.snapshot,false]))
]).then(([cur,rules,[L,live]])=>{renderCurrent(cur,L.scoring_settings);renderOpen(rules);renderRules(rules);renderScoring(L,live);renderSetup(L)})
 .catch(e=>{$("#rules").innerHTML=`<div class="callout">Failed to load: ${esc(e.message)}. Serve over http (e.g. <code>python3 -m http.server</code>), not file://.</div>`});
</script>
</body>
</html>
