<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f27;--mute:#6a7383;--line:#e2e5eb;--accent:#2457d6;--hi:#fff4d6;--hi-ink:#7a5200;
--pass:#1f8a4c;--fail:#b4382f;--pend:#b7791f;--tab:#7b5cc4}
@media(prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--ink:#e8ebf1;--mute:#98a1b3;--line:#2b3240;--accent:#7fa2ff;--hi:#3a2f0f;--hi-ink:#ffd27a;--pass:#4cc486;--fail:#ef7b72;--pend:#e3b25a;--tab:#b39cf0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:1000px;margin:auto}
h1{margin:0;font-size:24px}.sub{color:var(--mute);font-size:13px}
main{max-width:1000px;margin:auto;padding:0 16px 48px}
nav{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
nav button,.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:999px;cursor:pointer;font:inherit}
nav button.on,.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.filters label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
select,input[type=search]{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;width:100%}
.count{color:var(--mute);font-size:13px;margin:6px 0 10px}
.yr{margin:18px 0 6px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.rule{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px}
.rule h3{margin:0 0 5px;font-size:15px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.tag{padding:1px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px;font-weight:600}
.s-PASS{color:var(--pass);border-color:var(--pass)}.s-FAIL{color:var(--fail);border-color:var(--fail)}
.s-PENDING,.s-TABLED,.s-EXPLORE,.s-WITHDRAWN{color:var(--pend);border-color:var(--pend)}
.cat{color:var(--tab);border-color:var(--tab)}
.note{margin-top:5px;font-size:13px;color:var(--mute)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hi{background:var(--hi)}tr.hi td:first-child{color:var(--hi-ink);font-weight:600}
.badge{background:var(--hi);color:var(--hi-ink);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;margin-left:6px}
h2{font-size:17px;margin:20px 0 8px}
.callout{background:var(--hi);color:var(--hi-ink);border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:14px}
.callout ul{margin:6px 0 0;padding-left:18px}
.status{font-size:12px;color:var(--mute);margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.kv{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}.kv b{display:block;font-size:12px;color:var(--mute);font-weight:600}
</style>
</head>

/* ---- rulebook ---- */
const F = {q:"",cat:"",year:"",status:"PASS",from:"",to:""};
function renderRules(rules){
  const years=[...new Set(rules.map(r=>r.year))].sort((a,b)=>b-a);
  const opt=(o,sel)=>Object.entries(o).map(([k,v])=>`<option value="${k}"${sel===k?" selected":""}>${esc(v)}</option>`).join("");
  $("#rules").innerHTML=`
  <div class="filters">
    <label>Search<input type="search" id="fq" placeholder="e.g. kicker, IR, sacko"></label>
    <label>Type of rule<select id="fc"><option value="">All types</option>${opt(CATS,F.cat)}</select></label>
    <label>Status<select id="fs"><option value="">Every proposal</option>${opt(STATUS,F.status)}</select></label>
    <label>Instituted in<select id="fy"><option value="">Any year</option>${years.map(y=>`<option>${y}</option>`).join("")}</select></label>
    <label>From year<select id="ff"><option value="">–</option>${years.slice().reverse().map(y=>`<option>${y}</option>`).join("")}</select></label>
    <label>To year<select id="ft"><option value="">–</option>${years.slice().reverse().map(y=>`<option>${y}</option>`).join("")}</select></label>
  </div>
  <div class="count" id="cnt"></div><div id="list"></div>`;
  const apply=()=>{
    F.q=$("#fq").value.toLowerCase();F.cat=$("#fc").value;F.status=$("#fs").value;F.year=$("#fy").value;F.from=$("#ff").value;F.to=$("#ft").value;
    const m=rules.filter(r=>(!F.cat||r.category===F.cat)&&(!F.status||r.status===F.status)&&(!F.year||r.year==F.year)
      &&(!F.from||r.year>=+F.from)&&(!F.to||r.year<=+F.to)
      &&(!F.q||(r.title+" "+r.notes+" "+r.nominator).toLowerCase().includes(F.q)));
    $("#cnt").textContent=`${m.length} of ${rules.length} entries`;
    let out="",last=null;
    m.sort((a,b)=>b.year-a.year||a.id-b.id).forEach(r=>{
      if(r.year!==last){out+=`<div class="yr">${r.year}${r.year===2026?" suggestions (open)":""}</div>`;last=r.year}
      out+=`<div class="rule"><h3>${esc(r.title)}</h3><div class="meta">
        <span class="tag s-${r.status}">${esc(STATUS[r.status])}${r.vote?" · "+esc(r.vote):""}</span>${r.flag==="sup"?'<span class="tag s-FAIL">Superseded</span>':r.status==="PASS"&&r.flag==="once"?'<span class="tag">One-time</span>':r.status==="PASS"?'<span class="tag s-PASS">In force</span>':""}

}

/* ---- current rules ---- */
function renderCurrent(cur){
  const years=[...new Set(cur.map(r=>r.year).filter(Boolean))].sort((a,b)=>b-a);
  const cats=Object.entries(CATS).filter(([k])=>cur.some(r=>r.category===k));
  $("#current").innerHTML=`<div class="status">Every rule in force: the league site rules plus each rule passed over the years (2019 on) that hasn't been replaced. "Since" is the year it passed on the suggestions sheet. Replaced rules are in Rule history, tagged Superseded.</div>
  <div class="filters">
   <label>Search<input type="search" id="cq"></label>
   <label>Type of rule<select id="cc"><option value="">All types</option>${cats.map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("")}</select></label>
   <label>Instituted<select id="cy"><option value="">Any</option><option value="none">Not on sheet</option>${years.map(y=>`<option>${y}</option>`).join("")}</select></label></div>
  <div class="count" id="ccnt"></div><div id="clist"></div>`;
  const apply=()=>{
    const q=$("#cq").value.toLowerCase(),c=$("#cc").value,y=$("#cy").value;
    const order=Object.keys(CATS);
    const m=cur.filter(r=>(!c||r.category===c)&&(!y||(y==="none"?!r.year:r.year==y))&&(!q||(r.rule+" "+r.group+" "+r.notes).toLowerCase().includes(q)));
    m.sort((a,b)=>order.indexOf(a.category)-order.indexOf(b.category)||(a.source==="site"?0:1)-(b.source==="site"?0:1)||(a.year||0)-(b.year||0)||a.id-b.id);
    $("#ccnt").textContent=`${m.length} of ${cur.length} rules in force`;
    let out="",last=null;
    m.forEach(r=>{
      if(r.category!==last){out+=`<div class="yr">${esc(CATS[r.category])}</div>`;last=r.category}
      out+=`<div class="rule"><h3>${esc(r.rule)}</h3><div class="meta">${r.group?`<span class="tag cat">${esc(r.group)}</span>`:""}${r.year?`<span class="tag">since ${r.year}</span>`:'<span class="tag">year not on sheet</span>'}<span class="tag">${r.source==="site"?"league site":"suggestions sheet"}</span></div>${r.notes?`<div class="note">${esc(r.notes)}</div>`:""}</div>`;
    });
    $("#clist").innerHTML=out||'<div class="note">No rules match.</div>';
  };
  ["cq","cc","cy"].forEach(id=>$("#"+id).addEventListener(id==="cq"?"input":"change",apply));apply();
}
